{% extends 'base.html' %}
{% block title %}Edit building · Campus Eco-Tracker{% endblock %}
{% block content %}
<div class="container app-container page-container narrow-container"><div class="page-heading"><div class="eyebrow eyebrow-dark">ADMINISTRATION / CAMPUS DIRECTORY</div><h1>Edit building</h1><p>Update details for {{ building['name'] }}.</p></div><section class="content-card padded-card"><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-12"><label class="form-label" for="name">Building name</label><input class="form-control" id="name" name="name" required maxlength="100" value="{{ building['name'] }}"></div><div class="col-md-6"><label class="form-label" for="code">Building code</label><input class="form-control text-uppercase" id="code" name="code" required maxlength="20" value="{{ building['code'] }}"></div><div class="col-md-6"><label class="form-label" for="total_area_sqft">Total area (sq. ft.)</label><input class="form-control" id="total_area_sqft" name="total_area_sqft" type="number" min="1" step="0.01" required value="{{ building['total_area_sqft'] }}"></div><div class="col-12"><label class="form-label" for="department">Department / unit</label><input class="form-control" id="department" name="department" required maxlength="100" value="{{ building['department'] }}"></div><div class="col-12 d-flex gap-2 mt-4"><button class="btn btn-forest" type="submit">Save changes ↗</button><a class="btn btn-soft" href="{{ url_for('buildings') }}">Cancel</a></div></form></section></div>
{% endblock %}
