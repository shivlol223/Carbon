{% extends 'base.html' %}
{% block title %}Change password · Campus Eco-Tracker{% endblock %}
{% block content %}
<div class="container app-container page-container narrow-container"><div class="page-heading"><div class="eyebrow eyebrow-dark">ACCOUNT SETTINGS</div><h1>Change password</h1><p>Update your sign-in credentials.</p></div><section class="content-card padded-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label for="current_password" class="form-label">Current password</label><input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required></div><div class="mb-3"><label for="new_password" class="form-label">New password</label><input class="form-control" id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password" required><div class="form-text">Use at least 8 characters.</div></div><div class="mb-4"><label for="confirm_password" class="form-label">Confirm new password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div><div class="d-flex flex-wrap gap-2"><button class="btn btn-forest" type="submit">Update password ↗</button><a class="btn btn-soft" href="{{ url_for('dashboard') }}">Cancel</a></div></form></section></div>
{% endblock %}
